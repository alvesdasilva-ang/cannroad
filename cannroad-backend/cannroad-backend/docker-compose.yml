services:
  postgres:
    image: postgres:15-alpine
    container_name: cannroad-postgres
    environment:
      POSTGRES_USER: cannroad_user
      POSTGRES_PASSWORD: cannroad_pass
      POSTGRES_DB: cannroad_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cannroad_user -d cannroad_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cannroad-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cannroad-api
    environment:
      NODE_ENV: production
      DB_HOST: db.vhrxveogtlmoqivtnbln.supabase.co
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 2109ISA210925!
      DB_NAME: postgres
      JWT_SECRET: your_jwt_secret_change_in_production_12345
      CORS_ORIGIN: "https://alvesdasilva-ang.github.io"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    command: npm start
    networks:
      - cannroad-network

volumes:
  postgres_data:

networks:
  cannroad-network:
    driver: bridge
